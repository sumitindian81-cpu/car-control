<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520">
  <rect width="980" height="520" fill="#111"/>
  <text x="20" y="35" fill="#fff" font-size="22" font-family="Arial">Option 2: Fixed HUD Pedals</text>
  <text x="20" y="60" fill="#bbb" font-size="14" font-family="Arial">Pedal boxes fixed screen pe (easy but steering disturb ho sakta)</text>

  <!-- Game screen -->
  <rect x="20" y="80" width="940" height="400" rx="18" fill="#1d1f27" stroke="#444" stroke-width="2"/>
  <text x="40" y="110" fill="#9aa" font-size="14" font-family="Arial">Game View + Camera Feed Overlay</text>

  <!-- Fixed boxes -->
  <rect x="60" y="140" width="170" height="90" rx="12" fill="#2a2a2a" stroke="#888" stroke-width="2"/>
  <text x="95" y="195" fill="#fff" font-size="18" font-family="Arial">CLUTCH</text>

  <rect x="750" y="140" width="170" height="90" rx="12" fill="#2a2a2a" stroke="#888" stroke-width="2"/>
  <text x="795" y="195" fill="#fff" font-size="18" font-family="Arial">BRAKE</text>

  <rect x="320" y="330" width="340" height="120" rx="14" fill="#2a2a2a" stroke="#888" stroke-width="2"/>
  <text x="430" y="400" fill="#fff" font-size="22" font-family="Arial">ACCELERATOR</text>

  <!-- Hands -->
  <circle cx="380" cy="260" r="30" fill="#2b2f3a" stroke="#7aa7ff" stroke-width="3"/>
  <circle cx="600" cy="240" r="30" fill="#2b2f3a" stroke="#7aa7ff" stroke-width="3"/>
  <line x1="380" y1="260" x2="600" y2="240" stroke="#7aa7ff" stroke-width="5"/>
  <text x="440" y="225" fill="#9bbcff" font-size="12" font-family="Arial">Steering Angle (same logic)</text>

  <text x="40" y="490" fill="#ccc" font-size="13" font-family="Arial">
    Same rule: cursor inside box + pinch = press. (But finger travel zyada hota)
